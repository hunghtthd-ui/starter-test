<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drag and Drop Activity</title>
  <style>
    :root {
      --bg-page: #f5f6f8;
      --panel-bg: #ffffff;
      --border-color: #d8dee6;
      --card-bg: #fef9c3;
      --card-border: #c8b97a;
      --active-ring: #2563eb;
      --shadow-soft: 0 6px 18px rgba(15, 23, 42, 0.08);
      --shadow-drag: 0 14px 28px rgba(15, 23, 42, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-page);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
      overflow-x: hidden;
    }

    .activity-container {
      width: 100vw;
      min-height: 100dvh;
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(150px, 260px) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    /* Cột bên trái: Khay chứa 8 flashcards */
    .cards-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cards-tray {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: minmax(76px, 1fr);
      gap: 10px;
      align-content: stretch;
    }

    .card-slot {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 76px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Flashcard không chữ để kiểm tra từ vựng */
    .flashcard {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 4px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
      transition: box-shadow 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 2;
    }

    .flashcard:hover {
      border-color: #94a3b8;
    }

    .flashcard:focus-visible {
      outline: none;
      border-color: var(--active-ring);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
    }

    .flashcard.selected {
      border-color: var(--active-ring);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.28);
    }

    .flashcard.dragging {
      position: fixed !important;
      z-index: 9999 !important;
      cursor: grabbing;
      box-shadow: var(--shadow-drag);
      transform: scale(1.05);
      transition: none;
      pointer-events: none;
    }

    .flashcard.placed {
      position: absolute;
      width: clamp(64px, 9.5vw, 118px);
      aspect-ratio: 1 / 1;
      height: auto;
      z-index: 10;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.22);
    }

    .flashcard.placed.selected {
      z-index: 25;
    }

    .flashcard img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Khu vực bên phải: Hiển thị ảnh nền chính */
    .scene-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .scene-stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 320px;
      border-radius: 10px;
      overflow: hidden;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .scene-bg-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Tối ưu cho điện thoại và màn hình nhỏ */
    @media (max-width: 820px) {
      .activity-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(340px, 1fr);
        padding: 8px;
        gap: 10px;
      }

      .cards-panel {
        padding: 8px;
        border-radius: 12px;
      }

      .cards-tray {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: minmax(68px, auto);
        gap: 8px;
      }

      .card-slot {
        min-height: 68px;
        aspect-ratio: 1 / 1;
      }

      .flashcard.placed {
        width: clamp(54px, 16vw, 92px);
      }

      .scene-panel {
        padding: 8px;
        border-radius: 12px;
      }

      .scene-stage {
        min-height: 340px;
      }
    }

    @media (max-width: 440px) {
      .cards-tray {
        grid-auto-rows: minmax(58px, auto);
        gap: 6px;
      }

      .card-slot {
        min-height: 58px;
      }

      .flashcard.placed {
        width: clamp(48px, 18vw, 76px);
      }
    }
  </style>
</head>
<body>
  <main class="activity-container" id="activityApp">
    <aside class="cards-panel" aria-label="Flashcards">
      <div class="cards-tray" id="cardsTray">
        <div class="card-slot" data-slot="1">
          <div class="flashcard" data-card-id="1" tabindex="0" role="button" aria-label="Flashcard 1">
            <img src="./card1.jpg" alt="" />
          </div>
        </div>
        <div class="card-slot" data-slot="2">
          <div class="flashcard" data-card-id="2" tabindex="0" role="button" aria-label="Flashcard 2">
            <img src="./card2.jpg" alt="" />
          </div>
        </div>
        <div class="card-slot" data-slot="3">
          <div class="flashcard" data-card-id="3" tabindex="0" role="button" aria-label="Flashcard 3">
            <img src="./card3.jpg" alt="" />
          </div>
        </div>
        <div class="card-slot" data-slot="4">
          <div class="flashcard" data-card-id="4" tabindex="0" role="button" aria-label="Flashcard 4">
            <img src="./card4.jpg" alt="" />
          </div>
        </div>
        <div class="card-slot" data-slot="5">
          <div class="flashcard" data-card-id="5" tabindex="0" role="button" aria-label="Flashcard 5">
            <img src="./card5.jpg" alt="" />
          </div>
        </div>
        <div class="card-slot" data-slot="6">
          <div class="flashcard" data-card-id="6" tabindex="0" role="button" aria-label="Flashcard 6">
            <img src="./card6.jpg" alt="" />
          </div>
        </div>
        <div class="card-slot" data-slot="7">
          <div class="flashcard" data-card-id="7" tabindex="0" role="button" aria-label="Flashcard 7">
            <img src="./card7.jpg" alt="" />
          </div>
        </div>
        <div class="card-slot" data-slot="8">
          <div class="flashcard" data-card-id="8" tabindex="0" role="button" aria-label="Flashcard 8">
            <img src="./card8.jpg" alt="" />
          </div>
        </div>
      </div>
    </aside>

    <section class="scene-panel" aria-label="Scene">
      <div class="scene-stage" id="sceneStage">
        <img src="./scene.jpg" alt="" class="scene-bg-image" id="sceneImage" />
      </div>
    </section>
  </main>

  <script>
    (function () {
      const sceneStage = document.getElementById('sceneStage');
      const cardsTray = document.getElementById('cardsTray');
      const flashcards = Array.from(document.querySelectorAll('.flashcard'));

      // Lưu tọa độ tương đối (0..1) trên sceneStage để giữ đúng vị trí khi xoay màn hình / đổi kích thước
      const placedState = new Map();
      let selectedCard = null;
      let dragSession = null;
      let zCounter = 10;

      function setSelectedCard(card) {
        flashcards.forEach((item) => {
          item.classList.toggle('selected', item === card);
        });
        selectedCard = card || null;
      }

      function clampRatio(val) {
        return Math.max(0.04, Math.min(0.96, val));
      }

      function applyPlacedPosition(card, ratioX, ratioY) {
        const clampedX = clampRatio(ratioX);
        const clampedY = clampRatio(ratioY);
        placedState.set(card, { rx: clampedX, ry: clampedY });

        if (card.parentElement !== sceneStage) {
          sceneStage.appendChild(card);
        }

        card.classList.add('placed');
        card.style.left = `${clampedX * 100}%`;
        card.style.top = `${clampedY * 100}%`;
        card.style.transform = 'translate(-50%, -50%)';
        zCounter += 1;
        card.style.zIndex = String(zCounter);
      }

      function returnCardToTray(card) {
        placedState.delete(card);
        card.classList.remove('placed', 'dragging');
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.height = '';
        card.style.transform = '';
        card.style.zIndex = '';

        const cardId = card.getAttribute('data-card-id');
        const slot = cardsTray.querySelector(`.card-slot[data-slot="${cardId}"]`);
        if (slot && card.parentElement !== slot) {
          slot.appendChild(card);
        }
      }

      function syncAllPlacedCards() {
        placedState.forEach((pos, card) => {
          if (!card.classList.contains('dragging')) {
            card.style.left = `${pos.rx * 100}%`;
            card.style.top = `${pos.ry * 100}%`;
            card.style.transform = 'translate(-50%, -50%)';
          }
        });
      }

      function isOverScene(clientX, clientY) {
        const rect = sceneStage.getBoundingClientRect();
        return (
          clientX >= rect.left &&
          clientX <= rect.right &&
          clientY >= rect.top &&
          clientY <= rect.bottom
        );
      }

      function clientToStageRatio(clientX, clientY) {
        const rect = sceneStage.getBoundingClientRect();
        const rx = (clientX - rect.left) / Math.max(1, rect.width);
        const ry = (clientY - rect.top) / Math.max(1, rect.height);
        return { rx: clampRatio(rx), ry: clampRatio(ry) };
      }

      function startDrag(card, pointerId, clientX, clientY) {
        const rect = card.getBoundingClientRect();
        setSelectedCard(card);

        dragSession = {
          card,
          pointerId,
          startX: clientX,
          startY: clientY,
          offsetX: clientX - (rect.left + rect.width / 2),
          offsetY: clientY - (rect.top + rect.height / 2),
          width: rect.width,
          height: rect.height,
          moved: false
        };

        card.classList.add('dragging');
        card.style.width = `${rect.width}px`;
        card.style.height = `${rect.height}px`;
        card.style.left = `${clientX - dragSession.offsetX}px`;
        card.style.top = `${clientY - dragSession.offsetY}px`;
        card.style.transform = 'translate(-50%, -50%) scale(1.05)';
      }

      function moveDrag(clientX, clientY) {
        if (!dragSession) return;
        const dx = clientX - dragSession.startX;
        const dy = clientY - dragSession.startY;
        if (Math.hypot(dx, dy) > 4) {
          dragSession.moved = true;
        }

        const targetX = clientX - dragSession.offsetX;
        const targetY = clientY - dragSession.offsetY;
        dragSession.card.style.left = `${targetX}px`;
        dragSession.card.style.top = `${targetY}px`;
      }

      function finishDrag(clientX, clientY) {
        if (!dragSession) return;
        const { card, moved } = dragSession;
        dragSession = null;

        card.classList.remove('dragging');
        card.style.width = '';
        card.style.height = '';
        card.style.transform = '';

        const dropX = typeof clientX === 'number' ? clientX : dragSession?.startX;
        const dropY = typeof clientY === 'number' ? clientY : dragSession?.startY;

        if (moved && typeof dropX === 'number' && typeof dropY === 'number') {
          if (isOverScene(dropX, dropY)) {
            const { rx, ry } = clientToStageRatio(dropX, dropY);
            applyPlacedPosition(card, rx, ry);
          } else {
            returnCardToTray(card);
          }
        } else if (placedState.has(card)) {
          const existing = placedState.get(card);
          applyPlacedPosition(card, existing.rx, existing.ry);
        } else {
          returnCardToTray(card);
        }
      }

      flashcards.forEach((card) => {
        card.addEventListener('pointerdown', (event) => {
          if (event.button !== undefined && event.button !== 0 && event.pointerType === 'mouse') {
            return;
          }
          event.preventDefault();
          card.focus({ preventScroll: true });
          startDrag(card, event.pointerId, event.clientX, event.clientY);
        });

        card.addEventListener('dblclick', (event) => {
          event.preventDefault();
          if (placedState.has(card)) {
            returnCardToTray(card);
          }
        });
      });

      window.addEventListener('pointermove', (event) => {
        if (!dragSession || event.pointerId !== dragSession.pointerId) return;
        event.preventDefault();
        moveDrag(event.clientX, event.clientY);
      }, { passive: false });

      window.addEventListener('pointerup', (event) => {
        if (!dragSession || event.pointerId !== dragSession.pointerId) return;
        event.preventDefault();
        finishDrag(event.clientX, event.clientY);
      });

      window.addEventListener('pointercancel', (event) => {
        if (!dragSession || event.pointerId !== dragSession.pointerId) return;
        finishDrag(null, null);
      });

      // Hỗ trợ bàn phím: Enter/Space để đặt/nhận thẻ, phím mũi tên để di chuyển, Escape/Backspace/Delete để trả về khay
      window.addEventListener('keydown', (event) => {
        const activeCard =
          document.activeElement && document.activeElement.classList.contains('flashcard')
            ? document.activeElement
            : selectedCard;

        if (!activeCard) return;

        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          setSelectedCard(activeCard);
          if (!placedState.has(activeCard)) {
            applyPlacedPosition(activeCard, 0.5, 0.5);
          } else {
            const current = placedState.get(activeCard);
            applyPlacedPosition(activeCard, current.rx, current.ry);
          }
          return;
        }

        if (event.key === 'Escape' || event.key === 'Backspace' || event.key === 'Delete') {
          if (placedState.has(activeCard)) {
            event.preventDefault();
            returnCardToTray(activeCard);
          }
          return;
        }

        const step = event.shiftKey ? 0.06 : 0.02;
        let dx = 0;
        let dy = 0;

        if (event.key === 'ArrowLeft') dx = -step;
        else if (event.key === 'ArrowRight') dx = step;
        else if (event.key === 'ArrowUp') dy = -step;
        else if (event.key === 'ArrowDown') dy = step;

        if (dx !== 0 || dy !== 0) {
          event.preventDefault();
          setSelectedCard(activeCard);
          const pos = placedState.get(activeCard) || { rx: 0.5, ry: 0.5 };
          applyPlacedPosition(activeCard, pos.rx + dx, pos.ry + dy);
        }
      });

      window.addEventListener('resize', syncAllPlacedCards);
      window.addEventListener('orientationchange', () => {
        setTimeout(syncAllPlacedCards, 120);
      });
    })();
  </script>
</body>
</html>
